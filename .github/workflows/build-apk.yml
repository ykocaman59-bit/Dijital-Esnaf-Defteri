name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Projeyi Hazırla
      run: |
        npm install
        npx cap update android
        npx cap sync android

    - name: İsmi ve Ayarları Sabitle
      run: |
        STRING_FILE="android/app/src/main/res/values/strings.xml"
        if [ -f "$STRING_FILE" ]; then
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Dijital Esnaf Defteri<\/string>/g' "$STRING_FILE"
        fi

    - name: JDK 11 Kurulumu
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: APK Derle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: APK Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: Dijital-Esnaf-Defteri
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
