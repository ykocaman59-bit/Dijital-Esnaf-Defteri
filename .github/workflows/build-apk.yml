name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: SVG'yi PNG'ye Çevir ve Projeyi Hazırla
      run: |
        npm install
        # Sunucuya görsel dönüştürme aracı (ImageMagick) kuruyoruz
        sudo apt-get update && sudo apt-get install -y imagemagick
        
        # icon.svg dosyanı otomatik olarak icon.png formatına dönüştürüyoruz
        if [ -f "icon.svg" ]; then
          convert -background none icon.svg -resize 512x512 icon.png
        elif [ -f "assets/icon.svg" ]; then
          convert -background none assets/icon.svg -resize 512x512 assets/icon.png
        fi

        npm install -g @capacitor/assets
        npx @capacitor/assets generate --android || true
        npx cap update android
        npx cap sync android

    - name: Uygulama İsmini Güncelle
      run: |
        STRING_FILE="android/app/src/main/res/values/strings.xml"
        if [ -f "$STRING_FILE" ]; then
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Dijital Esnaf Defteri<\/string>/g' "$STRING_FILE"
        fi

    - name: JDK 11 Kurulumu
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: APK Derleme (Gradle)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: APK Dosyasını Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: Dijital-Esnaf-Defteri
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
